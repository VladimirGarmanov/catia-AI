[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catia-v5-mcp-server"
version = "0.2.0"
description = "MCP server connecting Codex and other MCP clients to CATIA V5 via COM automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Adam" },
]
keywords = ["catia", "catia-v5", "mcp", "claude", "dassault-systemes", "cao", "cad", "automation"]

dependencies = [
    "mcp>=1.0.0,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
catia-mcp = "catia_mcp.server:main"

[tool.setuptools.packages.find]
include = ["catia_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"
